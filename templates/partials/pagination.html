{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="صفحه‌بندی">
  {% if page_obj.has_previous %}
    <a href="?{% if query %}q={{ query }}&{% endif %}page={{ page_obj.previous_page_number }}" aria-label="صفحه قبل">‹</a>
  {% endif %}
  {% for num in page_obj.paginator.page_range %}
    {% if num == page_obj.number %}
      <span class="current" aria-current="page">{{ num }}</span>
    {% else %}
      <a href="?{% if query %}q={{ query }}&{% endif %}page={{ num }}">{{ num }}</a>
    {% endif %}
  {% endfor %}
  {% if page_obj.has_next %}
    <a href="?{% if query %}q={{ query }}&{% endif %}page={{ page_obj.next_page_number }}" aria-label="صفحه بعد">›</a>
  {% endif %}
</nav>
{% endif %}
