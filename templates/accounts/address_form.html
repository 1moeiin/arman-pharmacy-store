{% extends "base.html" %}
{% block content %}
  <div class="container section" style="max-width:560px;">
    <h1 class="reveal">{{ meta_title }}</h1>
    <form method="post" class="card reveal">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="form-errors">{{ field.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">ذخیره آدرس</button>
    </form>
  </div>
{% endblock %}
