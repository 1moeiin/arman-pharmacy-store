{% extends "base.html" %}
{% block content %}
  <div class="container section" style="max-width:480px;">
    <h1 class="reveal">ثبت‌نام</h1>
    <form method="post" class="card reveal" novalidate>
      {% csrf_token %}
      {% for field in form %}
        <div class="form-field">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}<small style="color:var(--color-text-muted)">{{ field.help_text }}</small>{% endif %}
          {% if field.errors %}<div class="form-errors">{{ field.errors|striptags }}</div>{% endif %}
        </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary btn-block">ثبت‌نام</button>
    </form>
    <p class="reveal">قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}">وارد شوید</a></p>
  </div>
{% endblock %}
